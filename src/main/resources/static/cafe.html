<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe World - Navora</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f5f5f5;
        }

        /* TITLE */
        .title{
            text-align:center;
            padding:20px;
            font-size:35px;
        }

        /* CAFE GRID */
        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:20px;
            padding:20px;
        }

        .card{
            background:white;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card h3{
            margin:12px;
        }

        .card button{
            margin:12px;
            padding:12px;
            border:none;
            background:#6f4e37;
            color:white;
            border-radius:10px;
            cursor:pointer;
            width:calc(100% - 24px);
            font-size:15px;
        }

        /* FULL VIEW */
        .view{
            display:none;
            position:fixed;
            inset:0;
            background:white;
            overflow:auto;
            z-index:999;
        }

        .header{
            background:#111;
            color:white;
            padding:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .close{
            cursor:pointer;
            font-size:24px;
        }

        /* DRINK GRID */
        .drink-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:18px;
            padding:20px;
        }

        .drink{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 3px 12px rgba(0,0,0,0.1);
        }

        .drink img{
            width:100%;
            height:170px;
            object-fit:cover;
        }

        .drink h4{
            margin:10px;
        }

        .price{
            margin:5px 10px;
            color:green;
            font-weight:bold;
        }

        .rating{
            margin:0 10px 12px;
            color:#666;
            font-size:14px;
        }

        .navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.theme-btn{
    cursor:pointer;
    font-size:20px;
    user-select:none;
}

/* DARK THEME */
body.dark-theme{
    background:#121212;
    color:white;
}

body.dark-theme .card{
    background:#1e1e1e;
    color:white;
}
        .navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.nav-right{
    display:flex;
    gap:15px;
    align-items:center;
}

.theme-btn{
    cursor:pointer;
    font-size:20px;
}

.cart{
    cursor:pointer;
    background:#ff5722;
    padding:6px 10px;
    border-radius:20px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:5px;
}

/* CART NUMBER */
#cartCount{
    background:white;
    color:black;
    border-radius:50%;
    padding:2px 6px;
    font-size:12px;
    font-weight:bold;
}

/* DARK MODE */
body.dark-theme{
    background:#121212;
    color:white;
}

body.dark-theme .card{
    background:#1e1e1e;
    color:white;
}

body.dark-theme .navbar{
    background:#000;
}

    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">🍽️ Navora</div>

    <div class="nav-right">
        <span class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</span>
    </div>
</div>
<!-- CART -->
<div class="cart" onclick="openCart()">
    🛒 <span id="cartCount">0</span>
</div>

<!-- THEME -->
<span class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</span>

</div>
</div>

<h1 class="title">☕ Navora Cafe World</h1>

<div class="grid" id="grid"></div>

<!-- FULL SCREEN VIEW -->

    }

    ];

    /* =========================
    RENDER CAFES
    ========================= */
    const grid = document.getElementById("grid");

    cafes.forEach((cafe,index)=>{

    grid.innerHTML += `

    <div class="card">

    <img src="${cafe.img}">

    <h3>${cafe.name}</h3>

    <button onclick="openCafe(${index})">
    See Details
    </button>

    </div>

    `;

    });

    /* =========================
    OPEN CAFE
    ========================= */
    function openCafe(index){

    document.getElementById("view").style.display="block";

    document.getElementById("cafeTitle").innerText =
    cafes[index].name;

    let menu = document.getElementById("menu");

    menu.innerHTML = `

    <div class="drink-grid">

    ${drinks.map(drink => `

    <div class="drink">

    <img src="${drink.img}">

    <h4>${drink.name}</h4>

    <div class="price">${drink.price}</div>

    <div class="rating">${drink.rating}</div>

    </div>

    `).join("")}

    </div>

    `;

    }

    /* =========================
    CLOSE
    ========================= */
    function closeCafe(){

    document.getElementById("view").style.display="none";

    }

</script>

</body>
</html>
